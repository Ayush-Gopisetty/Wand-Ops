<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>⚡ Wand Ops</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css" />
  <!--
    Photon JS SDK — loaded as a global script so window.Photon is available.
    IMPORTANT: Replace YOUR_PHOTON_APP_ID in src/network.js with a real App ID
    from https://dashboard.photonengine.com (free tier supports up to 20 CCU).
  -->
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <!-- HUD -->
  <div id="ui">
    <div id="crosshair"></div>

    <div id="health-wrap">
      <div id="health-track">
        <div id="health-bar"></div>
      </div>
      <span id="health-text">100 HP</span>
    </div>

    <div id="player-count">Players: 1</div>
    <div id="kda-tracker">K/D/A: 0 / 0 / 0</div>

    <div id="spell-indicator" data-spell="fire">🔥 Fire</div>
    <div id="effect-status"></div>

    <div id="kill-feed"></div>
  </div>

  <!-- Scoreboard (Tab) -->
  <div id="scoreboard">
    <div id="scoreboard-inner">
      <h2 id="scoreboard-title">Scoreboard</h2>
      <table id="scoreboard-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Player</th>
            <th>Kills</th>
            <th>Deaths</th>
          </tr>
        </thead>
        <tbody id="scoreboard-body"></tbody>
      </table>
      <p id="scoreboard-hint">Tab to close</p>
    </div>
  </div>

  <!-- Start / paused overlay -->
  <div id="overlay">
    <h1 id="overlay-title">⚡ Wand Ops</h1>
    <p id="overlay-status">Connecting…</p>

    <div id="spell-picker">
      <button class="spell-btn active" data-spell="fire">
        <span class="spell-icon">🔥</span>
        <span class="spell-name">Fire</span>
        <span class="spell-desc">Burn · 5 dmg/s · 3s</span>
      </button>
      <button class="spell-btn" data-spell="ice">
        <span class="spell-icon">❄️</span>
        <span class="spell-name">Ice</span>
        <span class="spell-desc">Slow · 70% · 3s</span>
      </button>
      <button class="spell-btn" data-spell="lightning">
        <span class="spell-icon">⚡</span>
        <span class="spell-name">Lightning</span>
        <span class="spell-desc">Silence · 2s</span>
      </button>
      <button class="spell-btn" data-spell="air">
        <span class="spell-icon">💨</span>
        <span class="spell-name">Air</span>
        <span class="spell-desc">Knockback · pushes</span>
      </button>
      <button class="spell-btn" data-spell="earth">
        <span class="spell-icon">🪨</span>
        <span class="spell-name">Earth</span>
        <span class="spell-desc">Grounded · 3s</span>
      </button>
    </div>

    <p id="overlay-hint">WASD · Mouse · LMB cast · Space jump</p>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
